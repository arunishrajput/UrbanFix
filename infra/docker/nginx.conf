# Serves the SPA and reverse-proxies the API so the browser talks to one origin
# (no CORS, first-party cookies). Put TLS in front of this (Caddy, Traefik, a load balancer).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream urbanfix_api {
  server api:4000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  client_max_body_size 12m;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://urbanfix_api;
    # nginx sets these for every response; drop the API's copies to avoid duplicates.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Connection "";
  }

  location /uploads/ {
    proxy_pass http://urbanfix_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_cache_valid 200 1d;
    expires 365d;
  }

  location /socket.io/ {
    proxy_pass http://urbanfix_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 75s;
  }

  # Hashed build assets never change.
  location /assets/ {
    expires 365d;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # The service worker and manifest must be revalidated so updates roll out.
  location ~* ^/(sw\.js|manifest\.webmanifest|registerSW\.js)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
